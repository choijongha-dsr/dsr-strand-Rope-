<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DSR 연선공정표</title>
<script src="/js/xlsx.full.min.js"></script>
<style>
/* Google Fonts 대신 시스템 한글 폰트 사용 (CDN 차단 환경 대응) */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --navy:#0f2744;--navy2:#1a3a5c;--navy3:#243f63;
  --red:#c0392b;--red2:#e74c3c;
  --green:#1e8449;--green2:#27ae60;
  --amber:#d68910;--amber2:#f39c12;
  --blue:#2980b9;--blue2:#3498db;
  --bg:#eef1f5;--white:#fff;--border:#dde2ea;
  --text:#1c2a3a;--muted:#7f8c9a;--muted2:#b0bec5;
  --shadow:0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg:0 4px 20px rgba(0,0,0,0.14);
}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','맑은 고딕','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* HEADER */
#hdr{
  background:var(--navy);color:#fff;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;position:sticky;top:0;z-index:200;
  border-bottom:3px solid var(--red);
}
#hdr h1{font-size:17px;font-weight:900;letter-spacing:-0.5px;white-space:nowrap;}
#hdr h1 span{color:var(--red2);}
.hdr-date{font-size:12px;color:#99b4c8;margin-left:2px;white-space:nowrap;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.btn{padding:7px 11px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;
  font-family:inherit;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:all 0.15s;}
.btn-green{background:var(--green2);color:#fff;}
.btn-green:hover{background:#219a52;}
.btn-navy{background:rgba(255,255,255,0.13);color:#dde;}
.btn-navy:hover{background:rgba(255,255,255,0.22);}
.btn-ghost{background:rgba(255,255,255,0.07);color:#99b;font-size:11px;}
#sync-dot{width:7px;height:7px;border-radius:50%;background:#444;display:inline-block;transition:background 0.3s;}
#sync-dot.ok{background:#2ecc71;}
#sync-dot.saving{background:var(--amber2);animation:pulse 0.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);}}

/* TABS */
#tabs{
  background:var(--navy2);
  display:flex;gap:4px;padding:7px 10px;
  overflow-x:auto;position:sticky;top:51px;z-index:199;
  scrollbar-width:none;
}
#tabs::-webkit-scrollbar{display:none;}
.tab{
  background:rgba(255,255,255,0.08);color:#abc;border:none;
  padding:8px 11px;border-radius:7px;cursor:pointer;
  white-space:nowrap;font-size:12px;font-weight:700;
  font-family:inherit;min-height:38px;transition:all 0.15s;flex-shrink:0;
}
.tab:hover{background:rgba(255,255,255,0.15);}
.tab.active{background:var(--red);color:#fff;}
.tab.tab-all{background:rgba(255,255,255,0.11);color:#cce;}
.tab.tab-all.active{background:#1a6ea8;}
.tab-badge{
  display:inline-block;background:rgba(255,255,255,0.2);
  border-radius:10px;padding:1px 6px;font-size:10px;margin-left:3px;
}
.tab.active .tab-badge{background:rgba(255,255,255,0.3);}

/* MACHINE INFO BAR */
#minfo{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:10px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.mstat{display:flex;flex-direction:column;gap:1px;}
.mstat-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
.mstat-val{font-size:19px;font-weight:900;color:var(--navy);}
.mstat-val.green{color:var(--green);}
.mstat-val.red{color:var(--red);}
.vdiv{width:1px;height:36px;background:var(--border);}
.progress-wrap{flex:1;min-width:130px;}
.progress-label{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px;}
.progress-bar{background:#dde2ea;border-radius:4px;height:9px;overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;transition:width 0.5s cubic-bezier(.4,0,.2,1);background:var(--green2);}
.progress-fill.warn{background:var(--amber2);}
.progress-fill.bad{background:var(--red);}
.progress-pct{font-size:12px;font-weight:800;color:var(--navy);margin-top:2px;}
.minfo-right{margin-left:auto;}
.filter-sel{padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;
  font-size:12px;font-family:inherit;background:#fff;cursor:pointer;}
.filter-sel:focus{outline:none;border-color:var(--blue2);}

/* CONTENT */
#content{padding:10px 10px 80px;}

/* SUMMARY CARDS */
.summary-grid{display:flex;flex-direction:column;gap:8px;}
.summary-card{
  background:var(--white);border-radius:10px;padding:12px 16px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;
  border-left:4px solid var(--border);cursor:pointer;transition:box-shadow 0.2s,transform 0.15s;
}
.summary-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.summary-card.c-active{border-left-color:var(--green2);}
.summary-card.c-warn{border-left-color:var(--amber2);}
.summary-card.c-bad{border-left-color:var(--red);}
.sc-name{font-weight:900;font-size:13px;color:var(--navy);min-width:88px;}
.sc-stats{display:flex;gap:18px;flex:1;flex-wrap:wrap;}
.sc-stat{text-align:center;}
.sc-stat-lbl{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;}
.sc-stat-val{font-size:15px;font-weight:900;}
.v-green{color:var(--green);}
.v-blue{color:var(--blue);}
.v-red{color:var(--red);}
.sc-prog{flex:1;min-width:90px;}
.sc-prog-bar{background:#e0e7ef;border-radius:4px;height:7px;overflow:hidden;margin-bottom:2px;}
.sc-prog-fill{height:100%;border-radius:4px;background:var(--green2);transition:width 0.4s;}
.sc-prog-fill.warn{background:var(--amber2);}
.sc-prog-fill.bad{background:var(--red);}
.sc-prog-pct{font-size:11px;font-weight:800;color:var(--navy);}

/* TABLE */
.tbl-wrap{background:var(--white);border-radius:10px;box-shadow:var(--shadow);overflow-x:auto;}
table{min-width:100%;border-collapse:collapse;font-size:11.5px;}
thead th{
  background:var(--navy);color:#fff;padding:8px 6px;
  text-align:center;font-size:10.5px;white-space:nowrap;font-weight:700;
  border-right:1px solid var(--navy3);position:sticky;top:0;
}
thead th:last-child{border-right:none;}
/* 기계 집계 행 */
tbody tr.mach-row{background:#e8edf6;border-bottom:2px solid var(--navy2);}
tbody tr.mach-row td{font-weight:700;color:var(--navy2);font-size:11px;padding:5px 6px;}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.1s;}
tbody tr:hover{background:#f5f7fb;}
tbody tr.done-row{background:#f0fdf4;}
tbody tr.done-row td{color:#aaa;}
td{padding:5px 6px;vertical-align:middle;}
.col-no{width:32px;text-align:center;color:var(--muted);font-size:11px;}
.no-link{color:var(--blue);font-weight:900;cursor:pointer;text-decoration:none;}
.no-link:hover{text-decoration:underline;}
.col-proc{min-width:220px;max-width:320px;}
.proc-main{font-weight:700;color:var(--navy);font-size:11.5px;line-height:1.4;}
.proc-sub{font-size:10px;color:var(--muted);margin-top:2px;display:flex;gap:4px;flex-wrap:wrap;}
.badge{display:inline-block;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:700;}
.badge-work{background:#eef2ff;color:#3949ab;}
.badge-ts{background:#fff3e0;color:#e65100;}
.col-출고{width:38px;text-align:center;font-size:11px;color:var(--muted);}
.col-drum{width:30px;text-align:center;font-size:11px;color:var(--navy);font-weight:700;}
.col-qty{text-align:right;font-weight:700;white-space:nowrap;padding-right:8px;min-width:65px;}
.col-input{width:76px;text-align:center;}
input.num-input{
  width:68px;padding:5px 4px;border:1.5px solid var(--border);
  border-radius:6px;text-align:right;font-size:13px;font-weight:700;
  font-family:inherit;color:var(--text);background:#fafbfc;
  -moz-appearance:textfield;appearance:textfield;
}
input.num-input::-webkit-inner-spin-button{display:none;}
input.num-input:focus{border-color:var(--blue2);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(52,152,219,0.12);}
input.num-input.has-val{background:#fff8e1;border-color:var(--amber2);}
.col-remain{width:72px;text-align:right;font-weight:900;font-size:12.5px;padding-right:8px;}
.remain-pos{color:var(--green);}
.remain-zero{color:var(--muted2);}
.remain-neg{color:var(--red);}
.col-status{width:98px;text-align:center;}
select.status-sel{
  width:100%;padding:4px 2px;border:1.5px solid var(--border);
  border-radius:6px;font-size:10.5px;font-family:inherit;background:#fff;cursor:pointer;min-height:30px;
}
select.status-sel:focus{outline:none;border-color:var(--blue2);}
select.status-sel.s-done{background:#e8f8f0;border-color:#27ae60;color:#1e6e3a;font-weight:700;}
select.status-sel.s-prog{background:#fff8e1;border-color:var(--amber2);color:#7a5800;font-weight:700;}
select.status-sel.s-iw{background:#eff6ff;border-color:var(--blue2);color:#1565c0;}
.col-wire{width:108px;font-size:10.5px;color:var(--muted);text-align:center;}
.col-notes{min-width:120px;font-size:10.5px;color:var(--muted);line-height:1.4;}
.col-date{width:42px;text-align:center;font-size:11px;color:var(--muted);}
.col-ratio{width:44px;text-align:center;font-size:11px;color:var(--muted);}
.layer-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700;color:#fff;margin-bottom:3px;margin-right:3px;}
.layer-상층{background:#3f51b5;}
.layer-중상층{background:#00bcd4;}
.layer-중중층{background:#4caf50;}
.layer-중하층{background:#ff9800;}
.layer-코아층{background:#6d4c41;}
.layer-코어층{background:#6d4c41;}

/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-icon{font-size:46px;margin-bottom:12px;}
.empty-state h3{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.empty-state p{font-size:13px;line-height:1.7;}

/* TOAST */
#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(15,25,45,0.92);color:#fff;
  padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;
  opacity:0;transition:opacity 0.25s;z-index:999;white-space:nowrap;
  pointer-events:none;backdrop-filter:blur(8px);
}
#toast.show{opacity:1;}

/* FAB */
.fab{
  position:fixed;bottom:22px;right:22px;width:52px;height:52px;
  background:var(--red);color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:21px;box-shadow:0 4px 16px rgba(192,57,43,0.45);
  cursor:pointer;z-index:900;transition:transform 0.2s,box-shadow 0.2s;border:none;
}
.fab:hover{transform:scale(1.07);}
.fab:active{transform:scale(0.95);}

/* MODAL */
.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.6);z-index:1000;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.25s;backdrop-filter:blur(4px);
}
.modal-overlay.active{opacity:1;pointer-events:auto;}
.modal{
  background:#fff;width:92%;max-width:580px;border-radius:16px;
  overflow:hidden;transform:translateY(20px);transition:transform 0.25s cubic-bezier(.22,1,.36,1);
  max-height:92vh;display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,0.3);
}
.modal-overlay.active .modal{transform:translateY(0);}
.modal-hdr{
  background:var(--navy);color:#fff;padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;
  font-weight:700;font-size:15px;flex-shrink:0;
}
.modal-body{padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;}
/* 터치 닫기 버튼 크게 */
.modal-close{
  background:rgba(255,255,255,0.15);border:none;color:#fff;
  font-size:20px;cursor:pointer;line-height:1;
  width:40px;height:40px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;
}
.modal-close:active{background:rgba(255,255,255,0.3);}
.m-group{display:flex;flex-direction:column;gap:6px;}
.m-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;}
.m-input{
  padding:12px 12px;border:2px solid var(--border);border-radius:10px;
  font-size:15px;font-family:inherit;width:100%;transition:border-color 0.15s;
  min-height:48px; /* 터치 최소 높이 */
}
.m-input:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 4px rgba(52,152,219,0.12);}
.m-input[readonly]{background:#f5f7fb;color:#666;cursor:default;}
.row-2{display:flex;gap:10px;}
.row-2>div{flex:1;}
.row-3{display:flex;gap:8px;}
.row-3>div{flex:1;}
/* 터치 버튼 최적화 */
.btn-primary{
  background:var(--red);color:#fff;border:none;padding:16px;
  border-radius:12px;font-weight:800;cursor:pointer;font-size:16px;font-family:inherit;
  transition:background 0.1s,transform 0.1s;touch-action:manipulation;
  min-height:56px;letter-spacing:0.3px;
}
.btn-primary:active{background:var(--red2);transform:scale(0.97);}
.btn-secondary{
  background:#e0e7ef;color:var(--text);border:none;padding:16px;
  border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;font-family:inherit;
  touch-action:manipulation;min-height:56px;
}
.btn-secondary:active{background:#ccd4df;transform:scale(0.97);}
.order-card{
  border:1.5px solid var(--border);padding:14px;border-radius:12px;
  background:#f9fafc;display:flex;flex-direction:column;gap:12px;
}
.order-card-title{font-size:14px;font-weight:700;color:var(--navy);border-bottom:1px solid #dde2ea;padding-bottom:8px;}

/* ── 터치 전용 작업일보 스타일 ── */
/* 환경정리 토글 버튼 */
.touch-env-btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:80px;padding:10px 16px;border-radius:24px;font-size:15px;font-weight:700;
  border:2.5px solid #ccc;background:#f5f7fb;color:#555;
  cursor:pointer;touch-action:manipulation;transition:all 0.15s;
  user-select:none;-webkit-user-select:none;
}
.touch-env-btn:active{transform:scale(0.93);}
.touch-env-btn.on-good{background:#1e8449;border-color:#1e8449;color:#fff;}
.touch-env-btn.on-bad{background:#c0392b;border-color:#c0392b;color:#fff;}
/* 보빈 셀 인풋 */
.wr-bb-input{
  width:100%;border:none;outline:none;font-size:13px;text-align:center;
  background:transparent;padding:2px;min-height:34px;
  touch-action:manipulation;
}
/* 시간 셀 인풋 */
.wr-hr-input{
  width:100%;height:100%;border:none;outline:none;font-size:11px;
  resize:none;background:transparent;padding:2px;touch-action:manipulation;
}
/* 작업내역 행 인풋 */
.wr-prd-input{
  width:100%;border:none;outline:none;font-size:14px;font-weight:700;
  text-align:center;background:transparent;padding:0 4px;
  min-height:40px;touch-action:manipulation;
  color:var(--red);
}
/* FAB 버튼 터치 최적화 */
.fab{touch-action:manipulation;}
.fab:active{transform:scale(0.9);}


/* ── ILBO (구 클래스 — 하위 호환용 최소 유지) ── */
.ibtn{padding:5px 10px;border:none;border-radius:5px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;}
.ibtn-g{background:var(--green2);color:#fff;}.ibtn-b{background:var(--blue2);color:#fff;}.ibtn-r{background:var(--red);color:#fff;}

/* PRINT */
@media print{
  #hdr,#tabs,#minfo .progress-wrap,#minfo .minfo-right,#toast,.fab{display:none!important;}
  body{background:#fff;}
  #content{padding:0;}
  .tbl-wrap{box-shadow:none;border-radius:0;}
  table{font-size:11px;}
  thead th{background:#000!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  input.num-input,select.status-sel{border:1px solid #ccc;background:transparent!important;}
}
@media(max-width:768px){
  .col-notes,.col-date,.col-ratio{display:none;}
  .vdiv{display:none;}
  #minfo{gap:8px;}
}
@keyframes rowDone{0%{background:#c8f7d4;}100%{background:#f0fdf4;}}
tbody tr.just-done{animation:rowDone 0.75s ease forwards;}
.mach-nav{
  background:var(--bg);border:1.5px solid var(--border);border-radius:6px;
  color:var(--navy);padding:5px 9px;cursor:pointer;font-size:15px;line-height:1;
  font-family:inherit;transition:all 0.15s;flex-shrink:0;
}
.mach-nav:hover:not(:disabled){background:var(--border);}
.mach-nav:disabled{opacity:0.3;cursor:default;}
.wr-remain-live{
  background:#e8f4fd;border-radius:6px;padding:7px 12px;font-size:13px;
  color:var(--navy);font-weight:700;text-align:center;margin-top:2px;
  transition:background 0.3s,color 0.3s;
}
.wr-remain-live.warn{background:#fff3cd;color:#7a5800;}
.wr-remain-live.over{background:#d5f5e3;color:var(--green);}

/* ── STRAND 일보 컨트롤 바 ── */
.ilbo-bar{
  background:var(--navy2);border-bottom:2px solid var(--red);
  padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  position:sticky;top:103px;z-index:50;
}
.ilbo-bar label{font-size:11px;font-weight:700;color:#aac;white-space:nowrap;}
.ilbo-bar select,.ilbo-bar input[type=date]{
  padding:5px 8px;border:1.5px solid rgba(255,255,255,0.2);border-radius:5px;
  font-family:inherit;font-size:12px;background:rgba(255,255,255,0.1);color:#fff;
}
.ilbo-bar select option{background:#1a3a5c;color:#fff;}
.ilbo-bar select:focus,.ilbo-bar input[type=date]:focus{outline:none;border-color:var(--blue2);}
#il-sst{font-size:11px;margin-left:2px;color:#f39c12;}

/* ── STRAND 일보 용지 ── */
#ilbo-wrap{background:#cfd3d8;padding:14px 10px 60px;min-height:calc(100vh - 140px);}
#ilbo-form{font-family:'Noto Sans KR',sans-serif;font-size:11.5px;}
#ilbo-form .ilfw{
  max-width:210mm;margin:0 auto;background:#fff;
  padding:7mm 6mm 6mm;
  box-shadow:0 4px 24px rgba(0,0,0,.22),0 1px 4px rgba(0,0,0,.1);
}

/* 기본 테이블 */
#ilbo-form .ilt{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:-1px;}
#ilbo-form .ilt th,#ilbo-form .ilt td{
  border:1px solid #333;padding:2px 4px;vertical-align:middle;
  text-align:center;line-height:1.35;font-size:11.5px;
}
#ilbo-form .ilt th{background:#d0d0d0;font-weight:700;height:26px;}
#ilbo-form .ilt td.illbl{background:#d0d0d0;font-weight:700;white-space:nowrap;}

/* 셀 내부 입력 */
#ilbo-form .ilt td input,#ilbo-form .ilt td select,#ilbo-form .ilt td textarea{
  width:100%;border:none;outline:none;font-family:inherit;font-size:11.5px;
  background:transparent;text-align:center;padding:0 2px;height:100%;resize:none;display:block;
}
#ilbo-form .ilt td input:focus,#ilbo-form .ilt td select:focus,#ilbo-form .ilt td textarea:focus{
  background:rgba(255,250,205,0.7);
}
#ilbo-form .ilt td input[type=number]{-moz-appearance:textfield;appearance:textfield;}
#ilbo-form .ilt td input[type=number]::-webkit-inner-spin-button{display:none;}
#ilbo-form .ilt td input.la{text-align:left;padding-left:4px;}

/* 시간 셀 */
#ilbo-form .ilhrtd{padding:0!important;}
#ilbo-form .ilhrtd textarea{font-size:9px!important;padding:1px!important;min-height:36px;line-height:1.25;height:100%;}

<body>

<div id="hdr">
  <h1>DSR <span>연선공정표</span></h1>
  <span class="hdr-date" id="hdr-date"></span>
  <div class="hdr-right">

    <button class="btn btn-navy" onclick="handleDayClose()" title="금일 생산량을 전일로 이동하고 잔량 차감">📅 전일마감</button>

      LIVE

    <button class="btn btn-navy" onclick="window.print()">🖨️ 인쇄</button>
  </div>
</div>

<div id="tabs"></div>
<div id="minfo"></div>
<div id="content"></div>
<div id="toast"></div>

<script>
const STATUS_OPTS = ['대기','IW완료','ST진행','ST완료','중층완료','1챠지완','완료'];

// 다층연 층 감지 (긴 키워드 먼저 - 부분 일치 방지)
const LAYER_KEYS = ['중상층','중중층','중하층','코아층','상층'];
// 다층연(6B) 설비 목록
const MULTILAYER_MACHINES = ['m9','m10','m11','m12'];
function detectLayer(s){
  return LAYER_KEYS.find(k => s.includes(k)) || '';
}

const MACHINES = [
  {id:'m1',  name:'16"x35B',   target:50000},
  {id:'m2',  name:'12"X36B-1', target:50000},
  {id:'m3',  name:'12"X36B-2', target:50000},
  {id:'m4',  name:'12"x25B-1', target:50000},
  {id:'m5',  name:'12"x35B-2', target:50000},
  {id:'m6',  name:'12"x42B',   target:50000},
  {id:'m7',  name:'10"x35B',   target:50000},
  {id:'m8',  name:'8"x36B',    target:50000},
  {id:'m9',  name:'12"x6B',    target:50000},
  {id:'m10', name:'14"X6B',    target:50000},
  {id:'m11', name:'16"X6B',    target:50000},
  {id:'m12', name:'10"X6B-2',  target:50000},
  {id:'m13', name:'12"x9B',    target:50000},
  {id:'m14', name:'14"X18B',   target:50000},
  {id:'m15', name:'24"X6B-2',  target:50000}
];

let currentMachine = 'all';
let prodData    = {};
let prevData    = {};
let baseOrders  = {};
let filterStatus = '';
let dailyLog     = {};
let lastCloseDate= '';

function getKSTDate(){
  const now=new Date();
  const kst=new Date(now.getTime()+(9*60-now.getTimezoneOffset())*60000);
  const y=kst.getFullYear(), m=String(kst.getMonth()+1).padStart(2,'0'), d=String(kst.getDate()).padStart(2,'0');
  return {dateStr:`${y}-${m}-${d}`, hour:kst.getHours(), kst};
}
function getYesterdayKST(){
  const now=new Date();
  const kst=new Date(now.getTime()+(9*60-now.getTimezoneOffset())*60000);
  kst.setDate(kst.getDate()-1);
  const y=kst.getFullYear(), m=String(kst.getMonth()+1).padStart(2,'0'), d=String(kst.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function saveToDailyLog(dateKey){
  if(!dateKey) return;
  const snap={};
  MACHINES.forEach(m=>{
    let dayTotal=0, nightTotal=0;
    const ordSnap={};
    getMachineOrders(m.id).forEach(o=>{
      const s=getOrderState(o);
      const d=Number(s.day)||0, n=Number(s.night)||0;
      dayTotal+=d; nightTotal+=n;
      if(d||n||s.status!=='대기'){
        ordSnap[o.id]={proc:o.proc, day:d, night:n, status:s.status,
          qty:prodData[o.id]?.qty!==undefined?prodData[o.id].qty:o.qty};
      }
    });
    if(dayTotal||nightTotal){
      snap[m.id]={name:m.name, dayTotal, nightTotal,
        ropeL:prevData[m.id]?.ropeL, weight:prevData[m.id]?.weight, orders:ordSnap};
    }
  });
  if(!dailyLog[dateKey]) dailyLog[dateKey]={};
  Object.assign(dailyLog[dateKey], snap);
}

function checkAutoClose(){
  const {dateStr:today, hour}=getKSTDate();
  if(lastCloseDate!==today && hour>=8){
    const closeDate=lastCloseDate||getYesterdayKST();
    saveToDailyLog(closeDate);
    MACHINES.forEach(m=>{
      let dayTotal=0, nightTotal=0;
      getMachineOrders(m.id).forEach(o=>{
        const s=getOrderState(o);
        const dayN=Number(s.day)||0, ngtN=Number(s.night)||0;
        dayTotal+=dayN; nightTotal+=ngtN;
        if(dayN>0||ngtN>0){
          if(!prodData[o.id]) prodData[o.id]={};
          const curQty=prodData[o.id].qty!==undefined?prodData[o.id].qty:o.qty;
          const newQty=Math.max(0,curQty-dayN-ngtN);
          prodData[o.id].qty=newQty;
          if(newQty===0&&s.status!=='완료') prodData[o.id].status='완료';
        }
      });
      prevData[m.id]={...(prevData[m.id]||{}), day:dayTotal, night:nightTotal};
    });
    Object.keys(prodData).forEach(id=>{
      if(prodData[id]){delete prodData[id].day; delete prodData[id].night;}
    });
    lastCloseDate=today;
    saveData();
    showToast(`📅 자동 마감 — ${closeDate} 실적 기록됨`);
  } else if(!lastCloseDate){
    lastCloseDate=today;
    saveData();
  }
}

function getOrderState(o){
  const saved = prodData[o.id];
  return {
    day:    saved?.day    !== undefined ? saved.day    : (o.initDay    ?? null),
    night:  saved?.night  !== undefined ? saved.night  : (o.initNight  ?? null),
    status: saved?.status !== undefined ? saved.status : (o.initSt     || '대기'),
  };
}

function getMachineOrders(mId){
  const arr = baseOrders[mId] || [];
  if(arr.length === 0){
    const h = MACHINES.find(x=>x.id===mId);
    if(h && h.orders) return [...h.orders];
  }
  return [...arr];
}

// ── STORAGE ──────────────────────────────────────────
// ── STORAGE ──────────────────────────────────────────
async function loadData(){
  setSyncDot('saving');
  try{
    const res = await fetch('/api/stranding/data');
    if(res.ok){
      const p = await res.json();
      if(p && Object.keys(p).length > 0){
        prodData      = p.orders      || {};
        prevData      = p.prev        || {};
        baseOrders    = p.baseOrders  || {};
        dailyLog      = p.dailyLog    || {};
        lastCloseDate = p.lastCloseDate || '';
        localStorage.setItem('dsr_prod_v3', JSON.stringify(p));
      } else {
        const localVal = localStorage.getItem('dsr_prod_v3');
        if(localVal){
          const lp = JSON.parse(localVal);
          prodData      = lp.orders      || {};
          prevData      = lp.prev        || {};
          baseOrders    = lp.baseOrders  || {};
          dailyLog      = lp.dailyLog    || {};
          lastCloseDate = lp.lastCloseDate || '';
        }
      }
    }
    setSyncDot('ok');
    showToast('✅ 서버 데이터 동기화 완료');
  }catch(e){
    try {
      const val = localStorage.getItem('dsr_prod_v3');
      if(val){
        const p = JSON.parse(val);
        prodData      = p.orders      || {};
        prevData      = p.prev        || {};
        baseOrders    = p.baseOrders  || {};
        dailyLog      = p.dailyLog    || {};
        lastCloseDate = p.lastCloseDate || '';
        showToast('⚠️ 서버 연결 실패 - 로컬 캐시 데이터 사용');
      } else {
        showToast('⚠️ 데이터 로드 오류');
      }
    } catch(err) {
      showToast('⚠️ 데이터 로드 오류');
    }
    setSyncDot('');
  }
  checkAutoClose();
  renderAll();
}

async function saveData(){
  setSyncDot('saving');
  const payload = {
    saved: new Date().toISOString(),
    orders: prodData,
    prev:   prevData,
    baseOrders,
    dailyLog,
    lastCloseDate
  };
  localStorage.setItem('dsr_prod_v3', JSON.stringify(payload));
  try{
    const res = await fetch('/api/stranding/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(res.ok){
      setSyncDot('ok');
      showToast('💾 서버 저장 완료');
    } else {
      throw new Error('Server response not ok');
    }
  }catch(e){
    setSyncDot('');
    showToast('💾 로컬 캐시 저장 (서버 전송 실패 - 네트워크 확인)');
  }
}

function setSyncDot(s){
  document.getElementById('sync-dot').className = s;
}

// 전일 마감: 금일 생산 → prevData, 잔량 차감, 금일 입력 초기화
function handleDayClose(){
  if(!confirm('금일 생산 실적을 전일 실적으로 이동하고,\n잔량을 차감한 후 금일 입력을 초기화하시겠습니까?')) return;
  // 전일 날짜로 일별 기록 저장
  const closeDate = lastCloseDate || getYesterdayKST();
  saveToDailyLog(closeDate);
  lastCloseDate = getKSTDate().dateStr;
  MACHINES.forEach(m => {
    let dayTotal=0, nightTotal=0;
    getMachineOrders(m.id).forEach(o => {
      const s    = getOrderState(o);
      const dayN = Number(s.day)   || 0;
      const ngtN = Number(s.night) || 0;
      dayTotal   += dayN;
      nightTotal += ngtN;

      // 금일 생산량을 총량에서 차감 → 다음 날 잔량 자동 반영
      if(dayN > 0 || ngtN > 0){
        if(!prodData[o.id]) prodData[o.id] = {};
        const curQty = prodData[o.id].qty !== undefined ? prodData[o.id].qty : o.qty;
        const newQty = Math.max(0, curQty - dayN - ngtN);
        prodData[o.id].qty = newQty;
        // 잔량 0이면 자동 완료 처리
        if(newQty === 0 && s.status !== '완료'){
          prodData[o.id].status = '완료';
        }
      }
    });
    prevData[m.id] = { ...(prevData[m.id] || {}), day: dayTotal, night: nightTotal };
  });
  Object.keys(prodData).forEach(id => {
    if(prodData[id]){ delete prodData[id].day; delete prodData[id].night; }
  });
  saveData();
  renderAll();
  showToast(`📅 전일 마감 완료 — ${closeDate} 기록됨`);
}

// ── RENDER ────────────────────────────────────────────
function renderAll(){
  renderTabs();
  const contentEl = document.getElementById('content');
  if(currentMachine === 'ilbo'){
    document.getElementById('minfo').innerHTML = '';
    contentEl.style.padding = '0';
    renderIlbo();
  } else if(currentMachine === 'all'){
    document.getElementById('minfo').innerHTML = '';
    contentEl.style.padding = '';
    renderSummary();
  } else {
    contentEl.style.padding = '';
    renderMachineInfo();
    renderTable();
  }
}

function renderTabs(){
  const el = document.getElementById('tabs');
  let html = `<button class="tab tab-all ${currentMachine==='all'?'active':''}" onclick="switchMachine('all')">
    📊 전체현황
  </button>`;
  html += MACHINES.map(m => {
    const orders = getMachineOrders(m.id);
    const done   = orders.filter(o=>getOrderState(o).status==='완료').length;
    return `<button class="tab ${m.id===currentMachine?'active':''}" onclick="switchMachine('${m.id}')">
      ${m.name}<span class="tab-badge">${done}/${orders.length}</span>
    </button>`;
  }).join('');
  const ilboCount = Object.keys(readIlboDB()).length;
  html += `<button class="tab ${currentMachine==='ilbo'?'active':''}" onclick="switchMachine('ilbo')">
    📝 작업일보${ilboCount?`<span class="tab-badge">${ilboCount}건</span>`:''}
  </button>`;
  el.innerHTML = html;
}

function renderSummary(){
  const el = document.getElementById('content');
  const hasAny = MACHINES.some(m => getMachineOrders(m.id).length > 0);
  if(!hasAny){
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📊</div>
      <h3>공정표 데이터 없음</h3>
      <p>서버가 공유폴더의 엑셀 파일을 읽는 중입니다.<br>잠시 후 자동으로 데이터가 표시됩니다.</p>
    </div>`;
    return;
  }

  let html = '<div class="summary-grid">';
  MACHINES.forEach(m => {
    const orders = getMachineOrders(m.id);
    if(!orders.length) return;
    const done   = orders.filter(o=>getOrderState(o).status==='완료').length;
    const inProg = orders.filter(o=>['ST진행','IW완료','중층완료','1챠지완','ST완료'].includes(getOrderState(o).status)).length;
    let dayTotal=0, nightTotal=0;
    orders.forEach(o=>{ const s=getOrderState(o); dayTotal+=Number(s.day)||0; nightTotal+=Number(s.night)||0; });
    const prod = dayTotal + nightTotal;
    const pct  = m.target ? Math.min(100, Math.round(prod/m.target*100)) : null;
    const cc   = pct===null?'': pct>=100?'c-active': pct>=60?'c-warn':'c-bad';
    const fc   = pct===null?'': pct>=100?'': pct>=60?'warn':'bad';
    html += `<div class="summary-card ${cc}" onclick="switchMachine('${m.id}')">
      <div class="sc-name">${m.name}</div>
      <div class="sc-stats">
        <div class="sc-stat"><div class="sc-stat-lbl">오더</div><div class="sc-stat-val">${orders.length}</div></div>
        <div class="sc-stat"><div class="sc-stat-lbl">완료</div><div class="sc-stat-val v-green">${done}</div></div>
        <div class="sc-stat"><div class="sc-stat-lbl">진행중</div><div class="sc-stat-val v-blue">${inProg}</div></div>
        <div class="sc-stat"><div class="sc-stat-lbl">금일생산</div><div class="sc-stat-val">${prod.toLocaleString()}m</div></div>
      </div>
      ${pct!==null?`<div class="sc-prog">
        <div class="sc-prog-bar"><div class="sc-prog-fill ${fc}" style="width:${pct}%"></div></div>
        <div class="sc-prog-pct">${pct}%</div>
      </div>`:''}
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

      <button class="btn" style="background:rgba(192,57,43,0.25);color:#ff9a9a;font-weight:700;" onclick="ilDeleteRecord()">🗑 삭제</button>
    </div>
  </div>

  <div id="ilbo-wrap">
  <div id="ilbo-form">
    <div class="ilfw">

      <!-- ① 타이틀 + 결재 -->
      <div class="iltrow">
        <div class="iltxt">STRAND 작업일보</div>
        <table class="ilappr">
          <tr><td class="ilrl" rowspan="2">결재</td><th>주 임</th><th>사 장</th></tr>
          <tr><td></td><td></td></tr>
        </table>
      </div>

      <!-- ② 작업일 -->
      <div class="ilwdr">
        <b style="margin-right:8px;">작업일 :</b>

function ilInitEnvToggles(){
  document.querySelectorAll('.il-env-tgl').forEach(el=>{
    el.addEventListener('click',()=>{
      const k=el.dataset.k, v=el.dataset.v;
      ilEnvState[k] = ilEnvState[k]===v ? '' : v;
      ilRenderEnvToggles();
      ilMarkDirty();
    });
  });
}
function ilRenderEnvToggles(){
  const IDS={feed:['il-ef-y','il-ef-b'],body:['il-eb-y','il-eb-b'],wind:['il-ew-y','il-ew-b']};
  const VALS=['양호','불량'];
  const CLS=['sel-good','sel-bad'];
  ['feed','body','wind'].forEach(k=>{
    VALS.forEach((v,i)=>{
      const el=document.getElementById(IDS[k][i]);
      if(!el) return;
      el.className='il-env-tgl'+(ilEnvState[k]===v?' '+CLS[i]:'');
    });
  });
}

function ilCalcTotal(){

  const tp=document.getElementById('il-totalProd');

}

function ilMarkDirty(){
  ilDirty=true;

function ilSyncDate(){
  const v=document.getElementById('il-date')?.value;
  if(!v) return;
  const d=new Date(v);
  const dow=['','월','화','수','목','금','토','일'];
  const g=id=>document.getElementById(id);
  if(g('il-fyr'))  g('il-fyr').value =String(d.getFullYear()).slice(2);
  if(g('il-fmo'))  g('il-fmo').value =String(d.getMonth()+1).padStart(2,'0');
  if(g('il-fday')) g('il-fday').value=String(d.getDate()).padStart(2,'0');
  if(g('il-fdow')) g('il-fdow').value=dow[d.getDay()===0?7:d.getDay()];
  ilMarkDirty();
}
function ilSyncMach(){
  const v=document.getElementById('il-mach')?.value;
  const fm=document.getElementById('il-fmach'); if(fm) fm.value=v;
  ilMarkDirty(); ilTryPrefill();
}
function ilSyncShift(){
  const v=document.getElementById('il-shift')?.value;
  const fs=document.getElementById('il-fshift'); if(fs) fs.value=v;

function ilOnFMachChange(){
  const v=document.getElementById('il-fmach')?.value;
  const rm=document.getElementById('il-mach'); if(rm) rm.value=v;
  ilMarkDirty(); ilTryPrefill();
}

function ilTryPrefill(){
  const machId=document.getElementById('il-fmach')?.value;
  const shift=document.getElementById('il-fshift')?.value||'주';
  if(!machId) return;
  const orders=getMachineOrders(machId).filter(o=>getOrderState(o).status!=='완료');
  if(!orders.length) return;
  let filled=0;
  for(let i=1;i<=4;i++){
    const noEl  =document.querySelector(`.il-or[data-f="no"][data-i="${i}"]`);
    const cfEl  =document.querySelector(`.il-or[data-f="conf"][data-i="${i}"]`);
    const grdEl =document.querySelector(`.il-or[data-f="grd"][data-i="${i}"]`);
    const diaEl =document.querySelector(`.il-or[data-f="dia"][data-i="${i}"]`);
    const prdEl =document.querySelector(`.il-or[data-f="prd"][data-i="${i}"]`);
    if(!noEl||noEl.value) continue;
    const o=orders[filled]; if(!o) break;
    if(noEl  && !noEl.value)  noEl.value =o.noGroup||'';
    if(cfEl  && !cfEl.value)  cfEl.value =o.proc||'';
    if(grdEl && !grdEl.value) grdEl.value=o.ts||'';
    if(diaEl && !diaEl.value) diaEl.value=o.dia||'';
    // 공정표 생산량 자동 반영
    if(prdEl && !prdEl.value){
      const st=getOrderState(o);
      const prod = shift==='주' ? (Number(st.day)||0) : (Number(st.night)||0);
      if(prod>0) prdEl.value=prod;
    }
    filled++;
  }
  ilCalcTotal();
  if(filled>0) showToast('📋 공정표 데이터 자동 채움 완료');
}

function ilCollect(){
  const orders=[];
  for(let i=1;i<=4;i++){
    const g=f=>document.querySelector(`.il-or[data-f="${f}"][data-i="${i}"]`)?.value||'';
    orders.push({no:g('no'),surf:g('surf'),conf:g('conf'),dir:g('dir'),oil:g('oil'),dia:g('dia'),grd:g('grd'),prd:g('prd'),std:g('std')});
  }
  const bb={};
  document.querySelectorAll('.il-bb').forEach(el=>{bb[el.dataset.r+'_'+el.dataset.n]=el.value||'';});
  const sd={};
  document.querySelectorAll('.il-sd').forEach(el=>{sd[el.dataset.k]=el.value||'';});
  const hr={};
  document.querySelectorAll('.il-hr').forEach(el=>{if(el.value.trim())hr[el.dataset.h]=el.value.trim();});
  return{
    yr: document.getElementById('il-fyr')?.value||'',
    mo: document.getElementById('il-fmo')?.value||'',
    dy: document.getElementById('il-fday')?.value||'',
    dow:document.getElementById('il-fdow')?.value||'',
    mach:  document.getElementById('il-fmach')?.value||'',
    worker:document.getElementById('il-fworker')?.value||'',
    shift: document.getElementById('il-fshift')?.value||'주',
    orders,bb,sd,hr,
    dt: document.getElementById('il-fdt')?.value||'',
    wb:document.getElementById('il-fwb')?.value||'',
    env:{...ilEnvState}
  };
}

function ilFill(d){
  if(!d) return;
  const g=id=>document.getElementById(id);
  if(g('il-fyr'))     g('il-fyr').value    =d.yr||'';
  if(g('il-fmo'))     g('il-fmo').value    =d.mo||'';
  if(g('il-fday'))    g('il-fday').value   =d.dy||'';
  if(g('il-fdow'))    g('il-fdow').value   =d.dow||'';
  if(g('il-fmach'))   g('il-fmach').value  =d.mach||'';
  if(g('il-fworker')) g('il-fworker').value=d.worker||'';
  if(g('il-fshift'))  g('il-fshift').value =d.shift||'주';
  if(g('il-mach'))    g('il-mach').value   =d.mach||'';
  if(g('il-shift'))   g('il-shift').value  =d.shift||'주';
  (d.orders||[]).forEach((o,idx)=>{
    const i=idx+1;
    const s=(f,v)=>{const el=document.querySelector(`.il-or[data-f="${f}"][data-i="${i}"]`);if(el)el.value=v||'';};
    s('no',o.no);s('surf',o.surf);s('conf',o.conf);s('dir',o.dir);s('oil',o.oil);
    s('dia',o.dia);s('grd',o.grd);s('prd',o.prd);s('std',o.std);
  });
  ilCalcTotal();
  const bb=d.bb||{};
  document.querySelectorAll('.il-bb').forEach(el=>{el.value=bb[el.dataset.r+'_'+el.dataset.n]||'';});
  const sd=d.sd||{};
  document.querySelectorAll('.il-sd').forEach(el=>{el.value=sd[el.dataset.k]||'';});
  document.querySelectorAll('.il-hr').forEach(el=>{el.value=(d.hr||{})[el.dataset.h]||'';});
  // 불가동 요인 (텍스트 필드)
  if(g('il-fdt')) g('il-fdt').value = typeof d.dt==='string' ? d.dt : '';
  if(g('il-fwb')) g('il-fwb').value=d.wb||'';
  // 환경정리 토글
  if(d.env) ilEnvState={...d.env};
  else ilEnvState={feed:'',body:'',wind:''};
  ilRenderEnvToggles();
}

function ilMakeKey(d){
  return`${d.yr||'00'}${(d.mo||'').padStart(2,'0')}${(d.dy||'').padStart(2,'0')}_${d.mach||'x'}_${d.shift||'주'}`;
}

async function ilSaveReport(){
  clearTimeout(ilAutoTimer);
  if(!document.getElementById('il-fyr')) return;
  const d=ilCollect(); const k=ilMakeKey(d);
  ilCurKey=k; ilDb[k]=d;
  localStorage.setItem('dsr_ilbo_v2',JSON.stringify(ilDb));
  ilDirty=false;
  const el=document.getElementById('il-sst');
  if(el){el.textContent='✓ 저장 중...';el.style.color='#f39c12';}
  try {
    const res = await fetch('/api/ilbo/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ilDb)
    });
    if(res.ok) {

function renderMachineInfo(){
  const m = MACHINES.find(x=>x.id===currentMachine);
  const orders = getMachineOrders(m.id);
  let dayTotal=0, nightTotal=0;
  orders.forEach(o=>{ const s=getOrderState(o); dayTotal+=Number(s.day)||0; nightTotal+=Number(s.night)||0; });
  const prod = dayTotal + nightTotal;
  const prevD = prevData[m.id]?.day   ?? 0;
  const prevN = prevData[m.id]?.night ?? 0;
  const pct   = m.target ? Math.min(100, Math.round(prod/m.target*100)) : null;
  const fc    = pct===null?'': pct>=100?'': pct>=70?'warn':'bad';

  const ropeL  = prevData[m.id]?.ropeL  != null ? Number(prevData[m.id].ropeL).toFixed(1)  : '-';
  const weight = prevData[m.id]?.weight != null ? Number(prevData[m.id].weight).toLocaleString() : '-';
  const machQty = prevData[m.id]?.machQty || 0;

  let html = `
    <div class="mstat"><div class="mstat-label">전일 주간</div><div class="mstat-val">${prevD.toLocaleString()}m</div></div>
    <div class="vdiv"></div>
    <div class="mstat"><div class="mstat-label">전일 야간</div><div class="mstat-val">${prevN.toLocaleString()}m</div></div>
    <div class="vdiv"></div>
    <div class="mstat"><div class="mstat-label">금일 생산</div><div class="mstat-val green">${prod.toLocaleString()}m</div></div>
    <div class="vdiv"></div>
    <div class="mstat"><div class="mstat-label">ROPE L</div><div class="mstat-val" style="font-size:14px;">${ropeL}</div></div>
    <div class="vdiv"></div>
    <div class="mstat"><div class="mstat-label">중량(kg)</div><div class="mstat-val" style="font-size:14px;">${weight}</div></div>`;
  if(pct !== null){
    html += `
    <div class="vdiv"></div>
    <div class="progress-wrap">
      <div class="progress-label">S/T 목표: ${m.target.toLocaleString()}m</div>
      <div class="progress-bar"><div class="progress-fill ${fc}" style="width:${pct}%"></div></div>
      <div class="progress-pct">${pct}%</div>
    </div>`;
  }
  html += `<div class="minfo-right">
    <select class="filter-sel" onchange="filterStatus=this.value;renderTable()">
      <option value="">전체 보기</option>
      ${STATUS_OPTS.map(s=>`<option value="${s}" ${filterStatus===s?'selected':''}>${s}</option>`).join('')}
      <option value="__미완료__" ${filterStatus==='__미완료__'?'selected':''}>미완료만</option>
    </select>
  </div>`;
  document.getElementById('minfo').innerHTML = html;
}

function renderTable(){
  const m = MACHINES.find(x=>x.id===currentMachine);
  const el = document.getElementById('content');
  const allOrders = getMachineOrders(m.id);

  if(!allOrders.length){
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📋</div>
      <h3>오더 없음</h3>
      <p>엑셀 업로드 후 이 기계의 오더가 표시됩니다.</p>
    </div>`;
    return;
  }

  let orders = allOrders;
  if(filterStatus === '__미완료__')      orders = allOrders.filter(o=>getOrderState(o).status!=='완료');
  else if(filterStatus)                  orders = allOrders.filter(o=>getOrderState(o).status===filterStatus);

  if(!orders.length){
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🔍</div>
      <h3>필터 결과 없음</h3>
      <p>"${filterStatus==='__미완료__'?'미완료':filterStatus}" 상태의 오더가 없습니다.</p>
    </div>`;
    return;
  }

  let rows = '';
  for(let i=0; i<orders.length;){
    const group = orders[i].noGroup || orders[i].id;
    let span = 1;
    while(i+span < orders.length && (orders[i+span].noGroup||orders[i+span].id) === group) span++;

    for(let j=0; j<span; j++){
      const o = orders[i+j];
      const s = getOrderState(o);
      const day   = s.day   !== null ? s.day   : '';
      const night = s.night !== null ? s.night : '';
      const dayN  = Number(day)  || 0;
      const nightN= Number(night)|| 0;
      const saved = prodData[o.id] || {};
      const actualQty = saved.qty !== undefined ? saved.qty : o.qty;
      const remain    = actualQty > 0 ? actualQty - dayN - nightN : null;
      const isDone      = s.status === '완료';
      const layerVal    = saved.layer !== undefined ? saved.layer : (o.layer || '');
      const isMultiLayer = span > 1 && MULTILAYER_MACHINES.includes(currentMachine);
      const layerBadge  = layerVal
        ? `<span class="layer-badge layer-${layerVal}">${layerVal}</span>` : '';
      const scls = s.status==='완료'?'s-done':
                   ['ST진행','ST완료','중층완료','1챠지완'].includes(s.status)?'s-prog':
                   s.status==='IW완료'?'s-iw':'';
      let opts = [...STATUS_OPTS];
      if(s.status && !opts.includes(s.status)) opts.push(s.status);
      opts.push('직접입력...');
      const sopts = opts.map(v=>`<option value="${v}" ${v===s.status?'selected':''}>${v}</option>`).join('');

      let remHtml = '<span class="remain-zero">-</span>';
      if(remain !== null){
        remHtml = remain <= 0
          ? `<span class="remain-zero">✓ 완료</span>`
          : `<span class="remain-pos">${remain.toLocaleString()}m</span>`;
      }

      let noCell = '';
      if(j === 0){
        noCell = `<td class="col-no" rowspan="${span}" style="border-right:1px solid var(--border);vertical-align:middle;background:${isMultiLayer?'#f0f4ff':'#f8faff'};text-align:center;">
          <span class="no-link" onclick="openWorkReport('${group}')" title="작업일보 작성">${o.noGroup||(i+1)}</span>
          ${isMultiLayer?`<div style="font-size:9px;color:var(--blue);margin-top:3px;font-weight:700;">다층연<br>${span}층</div>`:''}
        </td>`;
      }

      // 다층연 행 배경 구분 (짝수/홀수 층)
      const layerBg = isMultiLayer && layerVal
        ? (j%2===0?'background:#fafbff;':'background:#f5f7fc;') : '';

      rows += `<tr class="${isDone?'done-row':''}" data-id="${o.id}" style="${layerBg}">
        ${noCell}
        <td class="col-proc">
          ${layerBadge}
          <div class="proc-main">${o.proc}</div>
        </td>
        <td class="col-출고">${o.출고||''}</td>
        <td class="col-drum">${o.d45||''}</td>
        <td class="col-drum">${o.d36||''}</td>
        <td class="col-drum">${o.d30||''}</td>
        <td class="col-qty">${actualQty>0?actualQty.toLocaleString()+'m':'-'}</td>
        <td class="col-input">
          <input type="number" class="num-input ${day!==''?'has-val':''}" value="${day}" min="0" step="1"
            onchange="updateProd('${o.id}','day',this.value)"
            oninput="this.classList.toggle('has-val',this.value!='')">
        </td>
        <td class="col-input">
          <input type="number" class="num-input ${night!==''?'has-val':''}" value="${night}" min="0" step="1"
            onchange="updateProd('${o.id}','night',this.value)"
            oninput="this.classList.toggle('has-val',this.value!='')">
        </td>
        <td class="col-remain">${remHtml}</td>
        <td class="col-wire">
          <div>${o.wire||''}</div>
          ${(()=>{
            if(!saved.wireProd) return '';
            if(typeof saved.wireProd==='object'){
              const lines=Object.entries(saved.wireProd).filter(([,v])=>v)
                .map(([k,v])=>`<div style="color:#e91e63;font-size:10px;font-weight:700;">${k}: ${v}</div>`).join('');
              return lines;
            }
            return `<div style="color:#e91e63;font-weight:700;font-size:11px;">(${saved.wireProd})</div>`;
          })()}
        </td>
        <td class="col-wire">${o.wNo||''}</td>
        <td style="text-align:center;">${o.ts||''}</td>
        <td class="col-notes">${o.note||''}</td>
        <td class="col-date">${o.orderDate||''}</td>
        <td class="col-ratio">${o.ratio||''}</td>
        <td class="col-status">
          <select class="status-sel ${scls}" onchange="updateProd('${o.id}','status',this.value)">${sopts}</select>
        </td>
      </tr>`;
    }
    i += span;
  }

  el.innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr>
      <th class="col-no">No</th>
      <th class="col-proc">공정 및 작업 길이</th>
      <th class="col-출고">출고</th>
      <th class="col-drum">45</th>
      <th class="col-drum">36</th>
      <th class="col-drum">30</th>
      <th class="col-qty">총량</th>
      <th class="col-input">생산(주)</th>
      <th class="col-input">생산(야)</th>
      <th class="col-remain">잔량</th>
      <th class="col-wire">소선사양</th>
      <th class="col-wire">작업번호</th>
      <th>강도</th>
      <th class="col-notes">특기사항</th>
      <th class="col-date">지시일</th>
      <th class="col-ratio">RATIO</th>
      <th class="col-status">상태</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function updateProd(orderId, field, value){
  if(field === 'status' && value === '직접입력...'){
    const custom = prompt('원하시는 상태를 직접 입력해주세요:');
    if(!custom?.trim()){
      const o = getMachineOrders(currentMachine).find(x=>x.id===orderId);
      if(o){
        const sel = document.querySelector(`tr[data-id="${orderId}"] .status-sel`);
        if(sel) sel.value = getOrderState(o).status;
      }
      return;
    }
    value = custom.trim();
  }
  if(!prodData[orderId]) prodData[orderId] = {};
  if(field==='day'||field==='night'){
    prodData[orderId][field] = (value===''||value===null) ? null : Number(value);
  } else if(field==='qty'){
    prodData[orderId][field] = (value===''||value===null) ? undefined : Number(value);
  } else {
    prodData[orderId][field] = value;
  }

  if(currentMachine !== 'all'){
    renderMachineInfo();
    renderTabs();
    // Lightweight DOM update
    const o = getMachineOrders(currentMachine).find(x=>x.id===orderId);
    if(o){
      const row = document.querySelector(`tr[data-id="${orderId}"]`);
      if(row){
        const s = getOrderState(o);
        const dayN   = Number(s.day)  || 0;
        const nightN = Number(s.night)|| 0;
        const actualQty = prodData[orderId]?.qty !== undefined ? prodData[orderId].qty : o.qty;
        const remain    = actualQty > 0 ? actualQty - dayN - nightN : null;
        const remCell   = row.querySelector('.col-remain');
        if(remCell && remain !== null){
          remCell.innerHTML = remain <= 0
            ? `<span class="remain-zero">✓ 완료</span>`
            : `<span class="remain-pos">${remain.toLocaleString()}m</span>`;
        }
        row.classList.toggle('done-row', s.status==='완료');
        if(field === 'status'){
          const sel = row.querySelector('.status-sel');
          if(sel){
            sel.className = 'status-sel ' + (
              value==='완료'?'s-done':
              ['ST진행','ST완료','중층완료','1챠지완'].includes(value)?'s-prog':
              value==='IW완료'?'s-iw':''
            );
            if(![...sel.options].some(opt=>opt.value===value)){
              const opt = document.createElement('option');
              opt.value = opt.text = value;
              sel.insertBefore(opt, sel.options[sel.options.length-1]);
            }
            sel.value = value;
          }
        }
      }
    }
  }

  clearTimeout(window._saveTimer);
  window._saveTimer = setTimeout(saveData, 2000);
}

// ── EXCEL UPLOAD ──────────────────────────────────────
const MACH_NORM = {
  '16"x35b':'m1','12"x36b-1':'m2','12"x36b-2':'m3','12"x25b-1':'m4',
  '12"x35b-2':'m5','12"x42b':'m6','10"x35b':'m7','8"x36b':'m8',
  '12"x6b':'m9','14"x6b':'m10','16"x6b':'m11','10"x6b-2':'m12',
  '12"x9b':'m13','14"x18b':'m14','24"x6b-2':'m15'
};
function normMach(raw){
  if(!raw) return null;
  return MACH_NORM[String(raw).replace(/[\r\n\s]+/g,'').replace(/"/g,'"').toLowerCase()] || null;
}

function handleExcelUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = function(evt){ parseExcelBuffer(evt.target.result, '수동 업로드'); };
  reader.readAsArrayBuffer(file);
}

function parseExcelBuffer(arrayBuffer, source){
    try{
      const wb = XLSX.read(new Uint8Array(arrayBuffer), {type:'array'});
      const dateSheets = wb.SheetNames.filter(n=>/^\d+\.\d+$/.test(n.trim()));
      if(!dateSheets.length){ showToast('날짜 형식 시트(예: 5.11)를 찾을 수 없습니다.'); return; }

      const sheetName = dateSheets[dateSheets.length-1];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:null});

      const machIdxs = rows.reduce((acc,r,i)=>{
        if(r[0] && typeof r[0]==='string' && r[0].includes('"') && r[0]!=='기계명') acc.push(i);
        return acc;
      },[]);
      if(!machIdxs.length){ showToast('기계 행을 찾을 수 없습니다.'); return; }

      let newBaseOrders = {};
      machIdxs.forEach((mIdx, mi) => {
        const mrow = rows[mIdx];
        const mId  = normMach(mrow[0]);
        if(!mId) return;
        if(!prevData[mId]) prevData[mId]={};
        prevData[mId].day    = Number(mrow[9])  || 0;
        prevData[mId].night  = Number(mrow[10]) || 0;
        prevData[mId].remain = Number(mrow[11]) || 0;
        prevData[mId].ropeL  = mrow[13] != null ? Number(mrow[13]) : null;
        prevData[mId].weight = mrow[14] != null ? Number(mrow[14]) : null;
        prevData[mId].machQty = Number(mrow[2]) || 0;
        // S/T 목표가 엑셀에 있으면 MACHINES 배열 업데이트
        const excelTarget = Number(mrow[12]);
        if(excelTarget > 0){
          const mc = MACHINES.find(x=>x.id===mId);
          if(mc) mc.target = excelTarget;
        }
        if(!newBaseOrders[mId]) newBaseOrders[mId]=[];

        let lastNo = null;
        const nextIdx = machIdxs[mi+1] ?? rows.length;
        for(let ri=mIdx+1; ri<nextIdx; ri++){
          const row = rows[ri];
          if(!row) continue;
          const spec = row[2];
          if(!spec || typeof spec!=='string' || !spec.trim()) continue;
          const specStr = spec.trim();

          const hasQty    = Number(row[8]) > 0;
          const layerName = detectLayer(specStr);
          const startsDigit = /^\d/.test(specStr);
          if(!startsDigit && !layerName && !hasQty) continue;

          let noVal = '';
          if(row[0]!==null && row[0]!==undefined && String(row[0]).trim()) noVal = String(row[0]).trim();
          else if(row[1]!==null && row[1]!==undefined && String(row[1]).trim()) noVal = String(row[1]).trim();
          if(noVal && !noVal.includes('"') && noVal!=='기계명') lastNo = noVal;
          const currentNo = lastNo || String(ri);

          let newId = 'e_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
          if(baseOrders[mId]){
            const old = baseOrders[mId].find(x=>x.proc===specStr&&x.noGroup===currentNo);
            if(old) newId = old.id;
          }
          const rawSt = row[11] ? String(row[11]).trim() : '';
          const initSt = (rawSt==='완'||rawSt==='완료') ? '완료' : (STATUS_OPTS.find(s=>s===rawSt)||'대기');

          newBaseOrders[mId].push({
            id: newId, noGroup: currentNo,
            proc:      specStr,
            layer:     layerName,
            출고:       row[3]  ? String(row[3]).trim()  : '',
            d45:       row[5]  ? String(row[5]).trim()  : '',
            d36:       row[6]  ? String(row[6]).trim()  : '',
            d30:       row[7]  ? String(row[7]).trim()  : '',
            wire:      row[15] ? String(row[15]).trim() : '',
            wNo:       row[16] ? String(row[16]).trim() : '',
            ts:        row[17] ? String(row[17]).trim() : '',
            note:      row[18] ? String(row[18]).trim() : '',
            orderDate: row[19] ? String(row[19]).trim() : '',
            ratio:     row[20] ? String(row[20]).trim() : '',
            qty:       Number(row[8])  || 0,
            initSt,
            initDay:   Number(row[9])  || 0,
            initNight: Number(row[10]) || 0
          });
        }
      });

      // qty 전파: 다층연(6B) 설비만 그룹 내 전파 허용
      const grpQty={};
      for(const mId in newBaseOrders) newBaseOrders[mId].forEach(w=>{
        if(w.qty>0 && MULTILAYER_MACHINES.includes(mId)){
          const k=mId+'_'+w.noGroup;
          if(!grpQty[k]||w.qty>grpQty[k]) grpQty[k]=w.qty;
        }
      });
      for(const mId in newBaseOrders) newBaseOrders[mId].forEach(w=>{
        if(w.qty===0 && w.layer && MULTILAYER_MACHINES.includes(mId)){
          const k=mId+'_'+w.noGroup;
          if(grpQty[k]) w.qty=grpQty[k];
        }
      });

      baseOrders = newBaseOrders;
      const total = Object.values(newBaseOrders).reduce((a,arr)=>a+arr.length,0);
      saveData();
      renderAll();
      showToast(`📊 ${source||'업로드'} 완료 — ${sheetName} 시트 · ${total}건`);
    }catch(err){
      console.error(err);
      showToast('⚠️ 엑셀 오류: '+(err.message||'알 수 없는 오류'));
    }
}

// ── LIVE SYNC (WebSocket) ─────────────────────────────────────
(function initLiveSync(){
  const badge = document.getElementById('live-badge');
  const dot   = document.getElementById('live-dot');
  let ws, retryDelay = 2000;

  function setLiveStatus(connected){
    badge.style.display = connected ? 'flex' : 'none';
    if(connected){
      dot.style.animation = 'livepulse 2s infinite';
    }
  }

  function connect(){
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);

    ws.onopen = () => {
      setLiveStatus(true);
      retryDelay = 2000;
      console.log('[WS] 연결됨');
    };

    ws.onmessage = (e) => {
      try{
        const msg = JSON.parse(e.data);
        if(msg.type === 'excel-update'){
          // base64 → ArrayBuffer → 기존 파서
          const bin = atob(msg.data);
          const arr = new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
          parseExcelBuffer(arr.buffer, `📡 자동 동기화 (${msg.reason||''})`);
        } else if(msg.type === 'excel-error'){
          console.warn('[WS] Excel 오류:', msg.message);
        }
      }catch(err){ console.error('[WS] 메시지 처리 오류', err); }
    };

    ws.onclose = () => {
      setLiveStatus(false);
      console.log(`[WS] 연결 끊김, ${retryDelay/1000}초 후 재연결`);
      setTimeout(connect, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 30000);
    };

    ws.onerror = () => ws.close();
  }

  // DOM 로드 후 연결
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', connect);
  } else {
    connect();
  }
})();

  // 월요일 선택 관련 실수 수정
  document.getElementById('wr-dow').value = dow;

  // shift2 동기 (이제 토글 버튼 방식)
  document.getElementById('wr-shift2').addEventListener('change', function(){
    _wrSetShift(this.value);
  });

  setTimeout(()=>{
    document.getElementById('wrModal').classList.add('active');
    if(initialGroupKey) _wrFillFromOrder();
  },10);
}

// 주간/야간 토글 버튼
function _wrSetShift(v){
  document.getElementById('wr-shift').value = v;
  const dayBtn   = document.getElementById('wr-shift-day');
  const nightBtn = document.getElementById('wr-shift-night');
  if(v==='주'){
    if(dayBtn){   dayBtn.style.background='#2980b9';dayBtn.style.color='#fff';dayBtn.style.borderColor='#2980b9'; }
    if(nightBtn){ nightBtn.style.background='#f0f0f0';nightBtn.style.color='#888';nightBtn.style.borderColor='#ccc'; }
  } else {
    if(dayBtn){   dayBtn.style.background='#f0f0f0';dayBtn.style.color='#888';dayBtn.style.borderColor='#ccc'; }
    if(nightBtn){ nightBtn.style.background='#1a3a5c';nightBtn.style.color='#fff';nightBtn.style.borderColor='#1a3a5c'; }
  }
  const s2 = document.getElementById('wr-shift2');
  if(s2) s2.value = v;
  _wrFillFromOrder();
}

// 환경정리 터치 토글
function _wrToggleEnv(k, v){
  _wrEnvState[k] = (_wrEnvState[k]===v) ? '' : v;
  _wrRenderEnv();
}


function _wrRenderEnv(){
  const MAP={
    feed:{good:'wr-ef-y',bad:'wr-ef-b'},
    body:{good:'wr-eb-y',bad:'wr-eb-b'},
    wind:{good:'wr-ew-y',bad:'wr-ew-b'}
  };
  ['feed','body','wind'].forEach(k=>{
    const gEl = document.getElementById(MAP[k].good);
    const bEl = document.getElementById(MAP[k].bad);
    if(!gEl||!bEl) return;
    // 터치 버튼 클래스 적용
    gEl.className = 'touch-env-btn' + (_wrEnvState[k]==='양호' ? ' on-good' : '');
    bEl.className = 'touch-env-btn' + (_wrEnvState[k]==='불량' ? ' on-bad'  : '');
  });
}


window._currentWrOrders=[];
function _wrFillFromOrder(){
  const groupKey = document.getElementById('wrOrder').value;
  const shift = document.getElementById('wr-shift').value;
  document.getElementById('wr-shift2').value = shift;
  const tbody = document.getElementById('wr-ord-body');
  if(!groupKey){ tbody.innerHTML=''; window._currentWrOrders=[]; _wrCalcTotal(); return; }

  const matched = getMachineOrders(currentMachine).filter(o=>(o.noGroup||o.id)===groupKey);
  window._currentWrOrders = matched;

  let rows='';
  matched.forEach((o,idx)=>{
    const st = getOrderState(o);
    const prd = shift==='주' ? (st.day!==null?st.day:'') : (st.night!==null?st.night:'');
    // proc 파싱
    const proc=o.proc||'';
    let dia=o.dia||'', grade=o.ts||'';
    if(!dia){ const m=proc.match(/^([\d.]+)/); if(m) dia=m[1]; }
    let surf='', dir='', oil='';
    if(proc.match(/U\./i)) surf='U';
    else if(proc.match(/G\./i)) surf='G(도금)';
    const mDir=proc.match(/([A-Z]\/[ZS])/i);
    if(mDir){ dir=mDir[1]; }
    const mOil=proc.match(/\s+([A-Z][0-9])/i);
    if(mOil) oil=mOil[1];
    rows+=`<tr style="height:44px;">
      <td style="border:1.5px solid #222;text-align:center;font-size:13px;font-weight:700;">${o.noGroup||idx+1}</td>
      <td style="border:1.5px solid #222;text-align:center;font-size:11px;">${surf}</td>
      <td style="border:1.5px solid #222;padding:0 4px;font-size:11px;">${proc}</td>
      <td style="border:1.5px solid #222;text-align:center;font-size:12px;">${dir}</td>
      <td style="border:1.5px solid #222;text-align:center;font-size:11px;">${oil}</td>
      <td style="border:1.5px solid #222;text-align:center;font-size:13px;font-weight:700;">${dia}</td>
      <td style="border:1.5px solid #222;text-align:center;font-size:12px;">${grade}</td>
      <td style="border:1.5px solid #222;padding:0;background:#fffde7;">
        <input type="number" inputmode="decimal" class="wr-prd" data-id="${o.id}" data-shift="${shift}"
          value="${prd}" min="0"
          style="width:100%;border:none;outline:none;font-size:16px;font-weight:900;text-align:center;background:transparent;padding:0 4px;min-height:42px;color:#c0392b;touch-action:manipulation;"
          oninput="_wrCalcTotal()">
      </td>
      <td style="border:1.5px solid #222;padding:0;">
        <input type="number" inputmode="decimal" class="wr-std" data-id="${o.id}" step="0.01"
          value="" min="0"
          style="width:100%;border:none;outline:none;font-size:11px;text-align:center;background:transparent;padding:0 2px;">
      </td>
    </tr>`;
  });
  tbody.innerHTML = rows;

  // 보빈 검사표 행 생성
  const bbBody = document.getElementById('wr-bb-body');
  if(bbBody){
    const BB_ROWS=[
      {r:'len', lbl:'각보빈 생산길이', type:'number'},
      {r:'dia', lbl:'실제 S/T DIA(mm)', type:'number', step:'0.001'},
      {r:'rot', lbl:'자 전 회 수', type:'number'},
      {r:'idl', lbl:'무인가동 길이(M)', type:'number'},
      {r:'app', lbl:'외관(도유)상태', type:'text'},
      {r:'voi', lbl:'빇이스,교정로라', type:'text'},
      {r:'rpm', lbl:'RPM', type:'number'},
      {r:'pit', lbl:'PITCH(픿치)', type:'number', step:'0.1'},
    ];
    let bbHtml = BB_ROWS.map(row=>{
      const sa = row.step ? `step="${row.step}"` : '';
      const cells = Array.from({length:12},(_,j)=>
        `<td style="border:1.5px solid #222;padding:0;"><input type="${row.type}" class="wr-bb" data-r="${row.r}" data-n="${j+1}" ${sa}
          style="width:100%;border:none;outline:none;font-size:9px;text-align:center;background:transparent;padding:0 1px;"></td>`
      ).join('');
      return `<tr style="height:20px;"><td style="border:1.5px solid #222;background:#d0d0d0;font-size:9px;padding:0 2px;white-space:nowrap;font-weight:700;">${row.lbl}</td>${cells}</tr>`;
    }).join('');
    // 소선 DIA(mm) 2행
    bbHtml += `<tr style="height:18px;">
      <td rowspan="2" style="border:1.5px solid #222;background:#d0d0d0;font-size:9px;font-weight:700;text-align:center;line-height:1.3;"><b>소 선<br>DIA(mm)</b></td>
      <th style="border:1.5px solid #222;background:#e0e8f0;font-size:8px;text-align:center;">d0</th><th style="border:1.5px solid #222;background:#e0e8f0;font-size:8px;text-align:center;">d1</th>
      <th style="border:1.5px solid #222;background:#e0e8f0;font-size:8px;text-align:center;">dw,df</th><th style="border:1.5px solid #222;background:#e0e8f0;font-size:8px;text-align:center;">ds</th>
      <th style="border:1.5px solid #222;background:#e0e8f0;font-size:8px;text-align:center;">d2</th><td style="border:1.5px solid #222;background:#e8e8e8;"></td>
      <th style="border:1.5px solid #222;background:#e0e8f0;font-size:8px;text-align:center;">d0</th><th style="border:1.5px solid #222;background:#e0e8f0;font-size:8px;text-align:center;">d1</th>
      <th style="border:1.5px solid #222;background:#e0e8f0;font-size:8px;text-align:center;">dw,df</th><th style="border:1.5px solid #222;background:#e0e8f0;font-size:8px;text-align:center;">ds</th>
      <th style="border:1.5px solid #222;background:#e0e8f0;font-size:8px;text-align:center;">d2</th><td style="border:1.5px solid #222;background:#e8e8e8;"></td>
    </tr><tr style="height:18px;">
      ${['o1d0','o1d1','o1dwdf','o1ds','o1d2'].map(k=>`<td style="border:1.5px solid #222;padding:0;"><input type="number" class="wr-sd" data-k="${k}" step="0.001" style="width:100%;border:none;outline:none;font-size:9px;text-align:center;background:transparent;padding:0 1px;"></td>`).join('')}
      <td style="border:1.5px solid #222;background:#e8e8e8;"></td>
      ${['o2d0','o2d1','o2dwdf','o2ds','o2d2'].map(k=>`<td style="border:1.5px solid #222;padding:0;"><input type="number" class="wr-sd" data-k="${k}" step="0.001" style="width:100%;border:none;outline:none;font-size:9px;text-align:center;background:transparent;padding:0 1px;"></td>`).join('')}
      <td style="border:1.5px solid #222;background:#e8e8e8;"></td>
    </tr>`;
    bbBody.innerHTML = bbHtml;
  }

  _wrCalcTotal();
}

function _wrCalcTotal(){
  let s=0;
  document.querySelectorAll('.wr-prd').forEach(el=>{if(el.value)s+=Number(el.value)||0;});
  const t=document.getElementById('wr-total');
  if(t) t.textContent=s>0?s.toLocaleString():'';
}

function closeWorkReport(){
  const m=document.getElementById('wrModal');
  if(m){ m.classList.remove('active'); setTimeout(()=>m.remove(),250); }
}

function _wrBgClose(e){
  if(e.target.id==='wrModal') closeWorkReport();
}

function _wrSave(){
  if(!window._currentWrOrders?.length){ showToast('오더를 선택해주세요.'); return; }

  // 핵심 버그 수정: '주'/'야' → 'day'/'night' 필드명으로 변환해서 updateProd 호출
  document.querySelectorAll('.wr-prd').forEach(el=>{
    const field = el.dataset.shift==='주' ? 'day' : 'night';
    updateProd(el.dataset.id, field, el.value);
  });

  // 작업일보 DB에도 저장 (ilDb)
  const shift = document.getElementById('wr-shift2').value;
  const yr = document.getElementById('wr-yr').value;
  const mo = document.getElementById('wr-mo').value;
  const dy = document.getElementById('wr-dy').value;
  const dow2 = document.getElementById('wr-dow').value;
  const mId = currentMachine;
  const k = `${yr}${mo.padStart(2,'0')}${dy.padStart(2,'0')}_${mId}_${shift}`;
  const orders=[];
  document.querySelectorAll('.wr-prd').forEach((el,idx)=>{
    const o = window._currentWrOrders[idx];
    if(!o) return;
    const stdEl = document.querySelectorAll('.wr-std')[idx];
    orders.push({
      no: o.noGroup||String(idx+1),
      conf: o.proc||'',
      grd: o.ts||'',
      prd: el.value,
      std: stdEl?stdEl.value:''
    });
  });
  const bb={};
  document.querySelectorAll('.wr-bb').forEach(el=>{if(el.value)bb[el.dataset.r+'_'+el.dataset.n]=el.value;});
  const sd={};
  document.querySelectorAll('.wr-sd').forEach(el=>{if(el.value)sd[el.dataset.k]=el.value;});
  const hr={};
  document.querySelectorAll('.wr-hr').forEach(el=>{if(el.value.trim())hr[el.dataset.h]=el.value.trim();});
  const record = {
    yr, mo, dy, dow: dow2, mach: mId,
    worker: document.getElementById('wr-worker').value,
    shift,
    orders,
    dt: document.getElementById('wr-dt').value,
    wb: document.getElementById('wr-wb').value,
    env: {..._wrEnvState},
    bb, sd, hr
  };
  ilDb[k] = record;
  localStorage.setItem('dsr_ilbo_v2', JSON.stringify(ilDb));
  // 일보 DB 서버 저장
  fetch('/api/ilbo/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ilDb)}).catch(()=>{});
  // 코드 파트: 연선공정표 prodData도 서버에 동기화
  saveData();
  renderTable();
  renderTabs();
  closeWorkReport();
  showToast('✅ 작업일보 저장 + 공정표 반영 완료');
}

// FAB
document.body.insertAdjacentHTML('beforeend',
  `<button class="fab" onclick="openWorkReport()" title="작업일보 작성">📝</button>`);

// Ctrl+S
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='s'){
    e.preventDefault();
    if(currentMachine==='ilbo') ilSaveReport();
    else saveData();
  }
});

// INIT
const now=new Date(), KO=9*60;
const kst=new Date(now.getTime()+(KO-now.getTimezoneOffset())*60000);
const dayNames=['일','월','화','수','목','금','토'];
document.getElementById('hdr-date').textContent=
  `${kst.getFullYear()}년 ${kst.getMonth()+1}월 ${kst.getDate()}일 (${dayNames[kst.getDay()]})`;
loadData();
</script>
</body>
